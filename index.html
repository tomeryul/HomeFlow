<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מעבר דירה — HomeFlow 🏠</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#4f46e5; --brand-2:#6366f1; --brand-soft:#eef2ff;
    --green:#16a34a; --green-soft:#dcfce7; --blue:#2563eb; --blue-soft:#dbeafe;
    --amber:#d97706; --amber-soft:#fef3c7; --gray:#9ca3af; --gray-soft:#f3f4f6;
    --red:#dc2626; --red-soft:#fee2e2; --gold:#f4c542; --teal:#0d9488;
    --shadow:0 6px 24px rgba(17,24,39,.08); --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  a{color:var(--brand)}
  .hidden{display:none !important}

  /* ===== Auth ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 80% -10%,#e0e7ff 0%,transparent 60%),var(--bg)}
  .auth-card{background:var(--card);width:100%;max-width:420px;border-radius:20px;box-shadow:var(--shadow);padding:34px 30px;border:1px solid var(--line)}
  .auth-logo{font-size:40px;text-align:center}
  .auth-card h1{font-size:23px;margin:6px 0 2px;text-align:center}
  .auth-card p.sub{color:var(--muted);text-align:center;margin:0 0 22px;font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#374151}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fafafa;transition:border .15s,box-shadow .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:#fff}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--brand);color:#fff;width:100%;transition:transform .05s,background .15s}
  .btn:hover{background:var(--brand-2)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:var(--brand-soft);color:var(--brand)}
  .btn.secondary:hover{background:#e0e7ff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:8px 12px;font-size:13px;width:auto}
  .switch-line{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
  .switch-line a{cursor:pointer;font-weight:600}
  .msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13.5px;display:none}
  .msg.err{background:var(--red-soft);color:#991b1b;display:block}
  .msg.ok{background:var(--green-soft);color:#166534;display:block}
  .msg.info{background:var(--blue-soft);color:#1e40af;display:block}

  /* ===== Shell ===== */
  .app{display:none}
  .topbar{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;padding:18px 20px 0}
  .topbar-inner{max-width:1180px;margin:0 auto}
  .topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
  .topbar .spacer{flex:1}
  .who{font-size:13px;opacity:.95;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.18);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
  .icon-btn{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
  .icon-btn:hover{background:rgba(255,255,255,.28)}
  .hero{max-width:1180px;margin:14px auto 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .hero h2{margin:0;font-size:26px;font-weight:800}
  .counts{display:flex;gap:10px}
  .count{text-align:center;background:rgba(255,255,255,.15);border-radius:14px;padding:9px 16px;min-width:104px}
  .count b{display:block;font-size:26px;line-height:1.1}
  .count span{font-size:11.5px;opacity:.92}
  .count.gold{background:rgba(244,197,66,.28);box-shadow:inset 0 0 0 1.5px rgba(244,197,66,.7)}
  .count.gold b{color:#fde68a}
  .tabs{max-width:1180px;margin:16px auto 0;display:flex;gap:6px;overflow-x:auto}
  .tab{background:transparent;border:none;color:rgba(255,255,255,.8);padding:12px 16px;font-size:14.5px;font-weight:600;border-radius:12px 12px 0 0;white-space:nowrap}
  .tab.active{background:var(--bg);color:var(--brand)}
  .tab:hover:not(.active){color:#fff;background:rgba(255,255,255,.12)}
  .container{max-width:1180px;margin:0 auto;padding:20px}

  /* ===== Toolbar ===== */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 40px 11px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:#fff}
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search::before{content:"🔍";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  .toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;background:#fff}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
  .section-head h3{margin:0;font-size:20px;font-weight:700}
  .section-head .desc{color:var(--muted);font-size:13.5px}
  .progress-top{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
  .progress-top .lbl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:9px}
  .bar{height:10px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#22c55e);border-radius:999px;transition:width .5s}

  /* dashboard */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .stat .ico{font-size:26px}
  .stat .num{font-size:28px;font-weight:800;margin-top:6px}
  .stat .cap{color:var(--muted);font-size:13px;margin-top:2px}
  .stat .mini{height:7px;background:var(--gray-soft);border-radius:999px;margin-top:12px;overflow:hidden}
  .stat .mini>i{display:block;height:100%;border-radius:999px}
  .info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:18px}
  .info-card h4{margin:0 0 12px;font-size:16px}
  .contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .contact{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fafafe;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
  .contact b{display:block}.contact a{font-weight:600;text-decoration:none}

  /* accordion */
  .acc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .acc-head{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none}
  .acc-head:hover{background:#fafafe}
  .acc-title{font-size:16px;font-weight:700;flex:1;display:flex;align-items:center;gap:9px}
  .acc-meta{font-size:12.5px;color:var(--muted);font-weight:600}
  .chev{transition:transform .25s;font-size:13px;color:var(--muted)}
  .acc.open .chev{transform:rotate(-180deg)}
  .acc-mini{width:90px}.acc-mini .bar{height:8px}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .acc.open .acc-body{max-height:8000px}
  .acc-inner{padding:4px 18px 18px}

  /* tasks old/new */
  .apt{border-radius:var(--radius);padding:4px 0 2px;margin-bottom:22px}
  .apt-banner{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;padding:13px 18px;border-radius:14px;margin-bottom:14px;color:#fff}
  .apt-old .apt-banner{background:linear-gradient(135deg,#ef4444,#dc2626)}
  .apt-new .apt-banner{background:linear-gradient(135deg,#22c55e,#16a34a)}
  .apt-banner .cnt{margin-inline-start:auto;background:rgba(255,255,255,.25);padding:3px 11px;border-radius:999px;font-size:13px}
  .apt-old .acc{border-inline-start:4px solid #ef4444}
  .apt-new .acc{border-inline-start:4px solid #22c55e}
  .task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .task:first-child{border-top:none}
  .task .body{flex:1;min-width:0}
  .task .ttl{font-weight:500;font-size:14.5px}
  .task.done .ttl{text-decoration:line-through;color:var(--muted)}
  .task .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:#fff;border:none;padding:6px 10px;font-size:12.5px;color:var(--muted);border-inline-start:1px solid var(--line)}
  .seg button:first-child{border-inline-start:none}
  .seg button.on{color:#fff}
  .seg button.on.s-done{background:var(--green)}.seg button.on.s-progress{background:var(--blue)}.seg button.on.s-pending{background:var(--amber)}
  .chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px}
  .chip.p-urgent{background:var(--red-soft);color:#b91c1c}.chip.p-normal{background:var(--amber-soft);color:#92400e}.chip.p-low{background:var(--green-soft);color:#166534}
  select.prio{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;background:#fff}
  .note-btn{background:none;border:none;font-size:15px;position:relative}
  .note-btn .tip{position:absolute;bottom:130%;inset-inline-end:0;background:#1f2937;color:#fff;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:400;width:230px;text-align:start;box-shadow:var(--shadow);display:none;z-index:30;line-height:1.4}
  .note-btn:hover .tip{display:block}
  .note-input{margin-top:8px;width:100%;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:#fafafe;resize:vertical;min-height:0;height:36px}

  /* tables (shop / install) */
  .tbl-wrap{overflow-x:auto;margin-top:6px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
  table.tbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
  table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.tbl tr:hover td{background:#fafafe}
  .item-name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .link-ic{margin-inline-start:4px;text-decoration:none;font-size:13px}
  .ord{margin-inline-start:4px;font-size:10.5px;color:var(--muted);background:var(--gray-soft);padding:1px 6px;border-radius:6px;white-space:nowrap}
  .price{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
  .st-select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12.5px;background:#fff;font-weight:600;min-width:104px}
  .st-select.v-done,.st-select.v-arrived{color:var(--green);border-color:#bbf7d0;background:var(--green-soft)}
  .st-select.v-transit,.st-select.v-ordered{color:var(--blue);border-color:#bfdbfe;background:var(--blue-soft)}
  .st-select.v-coordinated{color:var(--teal);border-color:#99f6e4;background:#ccfbf1}
  .st-select.v-pending{color:var(--amber);border-color:#fde68a;background:var(--amber-soft)}
  .mini-input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;background:#fff;min-width:78px}
  .del-row{background:none;border:none;color:var(--red);font-size:15px;opacity:.55}.del-row:hover{opacity:1}
  .add-row{margin-top:12px}

  /* budget */
  .bud-hero{background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
  .bud-hero .tot b{font-size:34px;font-weight:800}
  .bud-hero .tot span{opacity:.7;font-size:13px;display:block}
  .bud-split{display:flex;gap:22px;flex-wrap:wrap}
  .bud-split div b{font-size:20px;font-weight:700;display:block}
  .bud-split div span{opacity:.7;font-size:12.5px}
  .bud-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.bud-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.bud-grid{grid-template-columns:1fr}}
  .bud-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:.15s}
  .bud-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,24,39,.12)}
  .bud-card .ttl{font-size:14.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .bud-card .amt{font-size:22px;font-weight:800;margin:8px 0 4px}
  .bud-card .sub{font-size:12px;color:var(--muted)}
  .bud-card .bar{margin-top:11px;height:8px}
  .bud-detail{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;display:none}
  .bud-card.open .bud-detail{display:block}
  .bud-line{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;gap:8px}
  .bud-line .nm{color:#374151}.bud-line .pr{font-weight:600;white-space:nowrap}

  /* grocery */
  .gro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-items:start}
  .gro-cat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .gro-cat h4{margin:0;padding:13px 16px;font-size:15px;background:var(--brand-soft);color:var(--brand);display:flex;justify-content:space-between;align-items:center}
  .gro-cat h4 .c{font-size:12px;background:#fff;border-radius:999px;padding:2px 9px}
  .gro-list{padding:6px 8px}
  .gro-item{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:14px}
  .gro-item:hover{background:#fafafe}
  .gro-item .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;transition:.15s}
  .gro-item.on .box{background:var(--green);border-color:var(--green)}
  .gro-item.on .nm{text-decoration:line-through;color:var(--muted)}

  /* timeline vertical */
  .tl{position:relative;padding-inline-start:8px}
  .tl-week{position:relative;padding-inline-start:34px;padding-bottom:8px;margin-bottom:10px}
  .tl-week::before{content:"";position:absolute;inset-inline-start:9px;top:26px;bottom:-10px;width:2px;background:var(--line)}
  .tl-week:last-child::before{display:none}
  .tl-node{position:absolute;inset-inline-start:0;top:3px;width:20px;height:20px;border-radius:50%;border:3px solid var(--brand);background:#fff;z-index:1}
  .tl-node.full{background:var(--green);border-color:var(--green)}
  .tl-node.part{background:var(--amber);border-color:var(--amber)}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px}
  .tl-card h4{margin:0 0 4px;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tl-card h4 .m{font-size:12px;color:var(--muted);font-weight:600}
  .tl-task{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
  .tl-task:first-of-type{border-top:none}
  .tl-check{width:21px;height:21px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;margin-top:1px;transition:.15s}
  .tl-task.done .tl-check{background:var(--green);border-color:var(--green)}
  .tl-task .tl-ttl{font-size:14px;flex:1}
  .tl-task.done .tl-ttl{text-decoration:line-through;color:var(--muted)}
  .tl-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;margin-top:1px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:540px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:18px}
  .modal-body{padding:20px}
  .x{background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
  .mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .mem:first-child{border-top:none}
  .mem .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700}
  .mem .info{flex:1;min-width:0}.mem .info small{color:var(--muted)}
  .role-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .role-manager{background:#ede9fe;color:#6d28d9}.role-full{background:var(--blue-soft);color:#1d4ed8}.role-limited{background:var(--gray-soft);color:#4b5563}
  .pending-tag{font-size:10.5px;color:var(--amber);font-weight:600}
  .add-mem{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .add-mem input{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
  .add-mem select{padding:10px;border:1px solid var(--line);border-radius:10px}

  .empty{text-align:center;color:var(--muted);padding:50px 20px}.empty .big{font-size:42px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:80}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:90;flex-direction:column;gap:14px}
  .spinner{width:42px;height:42px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:14px">טוען…</div></div>

<!-- AUTH -->
<div class="auth-wrap hidden" id="authView">
  <div class="auth-card">
    <div class="auth-logo">🏠</div>
    <h1 id="authTitle">התחברות</h1>
    <p class="sub">ניהול מעבר הדירה שלכם — במקום אחד</p>
    <div class="field"><label>אימייל</label><input type="email" id="authEmail" placeholder="name@example.com" autocomplete="email" /></div>
    <div class="field"><label>סיסמה</label><input type="password" id="authPass" placeholder="לפחות 6 תווים" autocomplete="current-password" /></div>
    <button class="btn" id="authBtn">התחברות</button>
    <div class="msg" id="authMsg"></div>
    <div class="switch-line" id="authSwitch">אין לכם חשבון? <a id="toSignup">הרשמה</a></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="brand">🏠 HomeFlow</div>

/* =================== AUTH =================== */
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ await afterLogin(session); } else { showAuth(); }
  $("loading").classList.add("hidden");
}
function showAuth(){ $("app").style.display="none"; $("authView").classList.remove("hidden"); }
function setAuthMode(mode){
  S.authMode=mode;
  $("authTitle").textContent = mode==="login"?"התחברות":"הרשמה";
  $("authBtn").textContent = mode==="login"?"התחברות":"יצירת חשבון";
  $("authSwitch").innerHTML = mode==="login" ? `אין לכם חשבון? <a id="toSignup">הרשמה</a>` : `כבר רשומים? <a id="toLogin">התחברות</a>`;
  $("authPass").setAttribute("autocomplete", mode==="login"?"current-password":"new-password");
  wireAuthSwitch(); $("authMsg").className="msg";
}
function wireAuthSwitch(){const su=$("toSignup"),li=$("toLogin");if(su)su.onclick=()=>setAuthMode("signup");if(li)li.onclick=()=>setAuthMode("login");}
function authMsg(t,k){const m=$("authMsg");m.textContent=t;m.className="msg "+k;}
$("authBtn").onclick = async ()=>{
  const email=$("authEmail").value.trim().toLowerCase(), pass=$("authPass").value;
  if(!email||!pass){authMsg("יש למלא אימייל וסיסמה","err");return;}
  $("authBtn").disabled=true;
  try{
    if(S.authMode==="login"){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error; await afterLogin(data.session);
    }else{
      if(pass.length<6){authMsg("הסיסמה חייבת להכיל לפחות 6 תווים","err");$("authBtn").disabled=false;return;}
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error)throw error;
      if(data.session){ await afterLogin(data.session); }
      else { authMsg("נשלח אליכם אימייל לאימות החשבון. לאחר האישור — התחברו כאן.","ok"); setAuthMode("login"); }
    }
  }catch(e){ authMsg(translateAuthErr(e.message),"err"); }
  finally{$("authBtn").disabled=false;}
};
function translateAuthErr(m){m=m||"";
  if(/Invalid login/i.test(m))return"אימייל או סיסמה שגויים";
  if(/already registered/i.test(m))return"האימייל כבר רשום — נסו להתחבר";
  if(/Email not confirmed/i.test(m))return"החשבון טרם אומת — בדקו את תיבת המייל";
  if(/rate limit/i.test(m))return"יותר מדי ניסיונות — נסו שוב בעוד רגע";
  return m;}
async function afterLogin(session){
  S.user=session.user;
  try{ await sb.rpc("claim_memberships"); }catch(e){}
  $("authView").classList.add("hidden"); $("app").style.display="block";
  $("userEmailLbl").textContent=S.user.email;
  await loadProjects();
}
$("logoutBtn").onclick = async ()=>{ if(S.channel){sb.removeChannel(S.channel);S.channel=null;} await sb.auth.signOut(); location.reload(); };

/* =================== PROJECTS =================== */
async function loadProjects(){
  const {data,error}=await sb.from("project_members").select("project_id, role, projects(id,name,move_date)").eq("user_id",S.user.id);
  if(error){toast("שגיאה בטעינת פרויקטים");console.error(error);return;}
  S.myProjects=(data||[]).filter(r=>r.projects);
  if(S.myProjects.length===0){ await createDefaultProject(); return; }
  const row=S.myProjects[0]; S.projectId=row.project_id; S.role=row.role; S.project=row.projects;
  await enterProject();
}
async function createDefaultProject(){
  const {data,error}=await sb.rpc("create_project",{p_name:"מעבר דירה",p_move_date:MOVE_DATE});
  if(error){toast("שגיאה ביצירת פרויקט");console.error(error);return;}
  S.projectId=data; S.role="manager"; S.project={id:data,name:"מעבר דירה",move_date:MOVE_DATE};
  await seedDefaults(); await enterProject();
}
const SEED_BUILD = {
  tasks: pid => SEED_TASKS.map((t,i)=>({project_id:pid,apartment:t[0],category:t[1],title:t[2],status:t[3],priority:t[4],notes:t[5],sort_order:i})),
  shop_items: pid => SEED_SHOP.map((s,i)=>({project_id:pid,category:s[0],item:s[1],supplier:s[2],link:s[3],order_number:s[4],price:Number(s[5])||0,status:s[6],budget_cat:s[7],notes:s[8],sort_order:i})),
  installations: pid => SEED_INSTALL.map((n,i)=>({project_id:pid,item:n[0],supplier:n[1],phone:n[2],date:n[3],time:n[4],status:n[5],delivery:Number(n[6])||0,payment:n[7],notes:n[8],sort_order:i})),
  timeline_items: pid => SEED_TIMELINE.map((w,i)=>({project_id:pid,week:w[0],title:w[1],done:false,sort_order:i})),
  grocery_items: pid => SEED_GROCERY.map((g,i)=>({project_id:pid,category:g[0],name:g[1],checked:false,sort_order:i}))
};
async function seedDefaults(){
  const pid=S.projectId;
  for(const tb of Object.keys(SEED_BUILD)) await sb.from(tb).insert(SEED_BUILD[tb](pid));
}
// Fill any tables that are empty (e.g. a project created before a feature existed)
async function backfillDefaults(){
  if(!canEdit()) return false;
  const pid=S.projectId; let did=false;
  const map={tasks:S.tasks, shop_items:S.shop, installations:S.install, timeline_items:S.timeline, grocery_items:S.grocery};
  for(const tb of Object.keys(map)){
    if((map[tb]||[]).length===0){
      const {error}=await sb.from(tb).insert(SEED_BUILD[tb](pid));
      if(!error) did=true;
    }
  }
  return did;
}
async function enterProject(){
  S.project=S.project||{};
  $("projTitle").textContent=(S.project.name||"מעבר דירה");
  renderRoleBadge(); loadFromCache(); await loadData();
  if(await backfillDefaults()) await loadData();
  subscribeRealtime();
  updateCountdowns();
}
function renderRoleBadge(){const m={manager:"מנהל הפרויקט",full:"הרשאה מלאה",limited:"הרשאה מוגבלת"};$("roleBadge").textContent="🔑 "+(m[S.role]||S.role);}

function loadFromCache(){
  try{const c=JSON.parse(localStorage.getItem(cacheKey())||"null");
    if(c){S.tasks=c.tasks||[];S.shop=c.shop||[];S.install=c.install||[];S.timeline=c.timeline||[];S.grocery=c.grocery||[];renderActive();}}catch(e){}
}
function saveCache(){
  try{localStorage.setItem(cacheKey(),JSON.stringify({tasks:S.tasks,shop:S.shop,install:S.install,timeline:S.timeline,grocery:S.grocery,ts:Date.now()}));}catch(e){}
}
async function loadData(){
  const pid=S.projectId;
  const [t,s,n,tl,m,g]=await Promise.all([
    sb.from("tasks").select("*").eq("project_id",pid).order("sort_order"),
    sb.from("shop_items").select("*").eq("project_id",pid).order("sort_order"),
    sb.from("installations").select("*").eq("project_id",pid).order("sort_order"),
    sb.from("timeline_items").select("*").eq("project_id",pid).order("sort_order"),
    sb.from("project_members").select("*").eq("project_id",pid).order("created_at"),
    sb.from("grocery_items").select("*").eq("project_id",pid).order("sort_order")
  ]);
  if(t.data)S.tasks=t.data; if(s.data)S.shop=s.data; if(n.data)S.install=n.data;
  if(tl.data)S.timeline=tl.data; if(m.data)S.members=m.data; if(g.data)S.grocery=g.data;
  $("membersBtn").textContent=`👥 חברים (${S.members.length})`;
  saveCache(); renderActive();
}
function subscribeRealtime(){
  if(S.channel)sb.removeChannel(S.channel);
  const tbls=["tasks","shop_items","installations","timeline_items","grocery_items"];
  let ch=sb.channel("proj-"+S.projectId);
  tbls.forEach(tb=>ch=ch.on("postgres_changes",{event:"*",schema:"public",filter:`project_id=eq.${S.projectId}`,table:tb},debouncedReload));
  S.channel=ch.subscribe();
}
let _rt; function debouncedReload(){clearTimeout(_rt);_rt=setTimeout(loadData,400);}

function updateCountdowns(){
  const k=daysTo(KEYS_DATE), mv=daysTo(MOVE_DATE);
  $("countKeys").textContent = k>=0?k:"✓";
  $("countMove").textContent = mv>=0?mv:"✓";
}

/* =================== FILTERS =================== */
function matchSearch(t){return !S.search || (t||"").toLowerCase().includes(S.search);}
function taskVisible(t){
  if(S.fStatus!=="all" && t.status!==S.fStatus)return false;
  if(S.fPrio!=="all" && t.priority!==S.fPrio)return false;
  return matchSearch(t.title+" "+t.category+" "+(t.notes||""));
}
const SHOP_STATUS_MAP={done:"done",arrived:"done",ordered:"progress",pending:"pending"};
function shopVisible(it){
  if(S.fStatus!=="all" && SHOP_STATUS_MAP[it.status]!==S.fStatus)return false;
  return matchSearch(it.item+" "+it.category+" "+(it.supplier||"")+" "+(it.notes||""));
}
const INST_STATUS_MAP={done:"done",transit:"progress",coordinated:"progress",pending:"pending"};
function instVisible(it){
  if(S.fStatus!=="all" && INST_STATUS_MAP[it.status]!==S.fStatus)return false;
  return matchSearch(it.item+" "+(it.supplier||"")+" "+(it.notes||""));
}
function tlVisible(it){
  if(S.fStatus==="done"&&!it.done)return false;
  if((S.fStatus==="pending"||S.fStatus==="progress")&&it.done)return false;
  return matchSearch(it.title+" "+it.week);
}
function groVisible(g){
  if(S.fStatus==="done"&&!g.checked)return false;
  if((S.fStatus==="pending"||S.fStatus==="progress")&&g.checked)return false;
  return matchSearch(g.name+" "+g.category);
}

function topProgress(title,desc,pct){

    <div class="progress-top"><div class="lbl"><span>התקדמות</span><span>${pct}%</span></div>${progressBar(pct)}</div>`;

/* ---------- Tasks (old vs new) ---------- */
function renderTasks(){
  const tot=S.tasks.length, done=S.tasks.filter(t=>t.status==="done").length;
  let html=topProgress("📋 משימות","מופרד לפי דירה ישנה (לעזוב) ודירה חדשה (להקים)", tot?Math.round(done/tot*100):0);
  let any=false;
  [["old",OLD_CATS],["new",NEW_CATS]].forEach(([apt,cats])=>{
    const aptTasks=S.tasks.filter(t=>t.apartment===apt);
    const aptVis=aptTasks.filter(taskVisible);
    if(aptVis.length===0)return;
    any=true;
    const adn=aptTasks.filter(t=>t.status==="done").length;
    let inner="";
    const allCats=[...new Set([...cats, ...aptTasks.map(t=>t.category)])];
    allCats.forEach(cat=>{
      const items=aptTasks.filter(t=>t.category===cat);
      const vis=items.filter(taskVisible);
      if(vis.length===0)return;
      const dn=items.filter(t=>t.status==="done").length, pct=Math.round(dn/items.length*100);
      inner+=`<div class="acc open" data-acc>
        <div class="acc-head" data-toggle><span class="chev">▼</span><span class="acc-title">${esc(cat)}</span>
          <span class="acc-meta">${dn}/${items.length}</span><span class="acc-mini">${progressBar(pct)}</span></div>
        <div class="acc-body"><div class="acc-inner">
          ${vis.map(renderTaskRow).join("")}
          ${canEdit()?`<button class="btn secondary sm add-row" data-addtask='${esc(JSON.stringify([apt,cat]))}'>➕ הוספת משימה</button>`:""}
        </div></div></div>`;
    });
    html+=`<div class="apt ${APT[apt].cls}"><div class="apt-banner">${APT[apt].lbl}<span class="cnt">${adn}/${aptTasks.length}</span></div>${inner}</div>`;
  });
  if(!any)html+=emptyState();
  $("tab-tasks").innerHTML=html;
}
function renderTaskRow(t){
  const noteTip=t.notes?`<button class="note-btn" tabindex="-1">💬<span class="tip">${esc(t.notes)}</span></button>`:"";
  const seg=TASK_ST_ORDER.map(k=>`<button class="${t.status===k?"on "+TASK_ST[k].cls:""}" data-status="${k}">${TASK_ST[k].lbl}</button>`).join("");
  const prioSel=`<select class="prio" data-prio ${canEdit()?"":"disabled"}>${Object.keys(PRIO).map(p=>`<option value="${p}" ${t.priority===p?"selected":""}>${PRIO[p]}</option>`).join("")}</select>`;
  const noteEditor=canEdit()?`<textarea class="note-input" data-note placeholder="הערה…">${esc(t.notes||"")}</textarea>`:"";
  return `<div class="task ${t.status==="done"?"done":""}" data-task="${t.id}"><div class="body">
    <div class="ttl">${esc(t.title)} ${noteTip}</div>
    <div class="controls"><span class="seg" data-seg>${seg}</span>${prioSel}<span class="chip p-${t.priority}">${PRIO[t.priority]}</span></div>
    ${noteEditor}</div></div>`;
}

/* ---------- Budget ---------- */
function budgetData(){
  const cats={};
  S.shop.forEach(s=>{ const c=s.budget_cat||"📦 שונות"; (cats[c]=cats[c]||{total:0,got:0,items:[]});
    cats[c].total+=(Number(s.price)||0); if(shopGot(s))cats[c].got+=(Number(s.price)||0); cats[c].items.push(s); });
  const delivTotal=S.install.reduce((a,x)=>a+(Number(x.delivery)||0),0);
  const delivDone=S.install.filter(x=>x.status==="done").reduce((a,x)=>a+(Number(x.delivery)||0),0);
  const products=Object.values(cats).reduce((a,c)=>a+c.total,0);
  return {cats,delivTotal,delivDone,products};
}
function renderBudget(){
  const b=budgetData();
  const grand=b.products+b.delivTotal;
  let cards="";
  Object.keys(b.cats).sort((a,c)=>b.cats[c].total-b.cats[a].total).forEach(cat=>{
    const c=b.cats[cat]; const pct=c.total?Math.round(c.got/c.total*100):0;
    const det=c.items.filter(i=>Number(i.price)>0).sort((x,y)=>y.price-x.price)
      .map(i=>`<div class="bud-line"><span class="nm">${shopGot(i)?"✅":"⏳"} ${esc(i.item)}</span><span class="pr">${ils(i.price)}</span></div>`).join("")||`<div class="bud-line"><span class="nm">אין פריטים עם מחיר</span></div>`;
    cards+=`<div class="bud-card ${S.budOpen===cat?"open":""}" data-bud="${esc(cat)}">
      <div class="ttl">${esc(cat)} <span style="font-size:12px;color:var(--muted)">${c.items.length}</span></div>
      <div class="amt">${ils(c.total)}</div>
      <div class="sub">שולם/הגיע: ${ils(c.got)} · ${pct}%</div>
      <div class="bar"><i style="width:${pct}%;background:var(--green)"></i></div>
      <div class="bud-detail">${det}</div></div>`;
  });
  // delivery card
  const dpct=b.delivTotal?Math.round(b.delivDone/b.delivTotal*100):0;
  const ddet=S.install.filter(i=>Number(i.delivery)>0).sort((x,y)=>y.delivery-x.delivery)
    .map(i=>`<div class="bud-line"><span class="nm">${i.status==="done"?"✅":"⏳"} ${esc(i.item)}</span><span class="pr">${ils(i.delivery)}</span></div>`).join("")||"—";
  cards+=`<div class="bud-card ${S.budOpen==="__deliv"?"open":""}" data-bud="__deliv">
    <div class="ttl">🚚 הובלות והרכבות</div><div class="amt">${ils(b.delivTotal)}</div>
    <div class="sub">בוצע: ${ils(b.delivDone)} · ${dpct}%</div>
    <div class="bar"><i style="width:${dpct}%;background:var(--teal)"></i></div>
    <div class="bud-detail">${ddet}</div></div>`;

  $("tab-budget").innerHTML=`
    <div class="section-head"><div><h3>💰 תקציב</h3><div class="desc">סיכום הוצאות לפי קטגוריה — לחיצה על כרטיס פותחת פירוט</div></div></div>
    <div class="bud-hero">
      <div class="tot"><b>${ils(grand)}</b><span>סך הוצאות מתוכננות</span></div>
      <div class="bud-split">
        <div><b>${ils(b.products)}</b><span>מוצרים (${S.shop.length} פריטים)</span></div>
        <div><b>${ils(b.delivTotal)}</b><span>הובלות והרכבות</span></div>
        <div><b>${ils(b.products? Math.round((b.cats&&Object.values(b.cats).reduce((a,c)=>a+c.got,0))+b.delivDone):0)}</b><span>כבר שולם/הגיע</span></div>
      </div>
    </div>
    <div class="bud-grid">${cards}</div>`;
}

/* ---------- Timeline (vertical) ---------- */
function tlBadge(t){
  const map=[["מפתח","🔑 מפתח"],["ריסוס","🧹 ניקיון"],["ניקיון","🧹 ניקיון"],["מים","🏢 מוסדות"],["ארנונה","🏢 מוסדות"],
    ["חשמל","🏢 מוסדות"],["פרטנר","📞 תקשורת"],["סשה","🚚 הובלה"],["הובלה","🚚 הובלה"],["מעבר","🚚 הובלה"],
    ["שרון","🏠 דירה ישנה"],["צ׳ק","💰 כספים"],["ביטוח","💰 כספים"],["הזמנ","🛒 קניות"],["קש קטר","🛒 קניות"],
    ["פנדה","🛒 קניות"],["סטוק","🛒 קניות"],["אריזה","📦 אריזה"],["מזוז","📦 אריזה"],["מחסן","📦 אריזה"],
    ["מנוי","🏋️ פנאי"],["פריקה","📦 פריקה"],["כושר","🏋️ פנאי"]];
  for(const[k,v]of map)if(t.includes(k))return v;
  return "📌 כללי";
}
function renderTimeline(){
  const weeks=[...new Set(S.timeline.map(t=>t.week))];
  const dn=S.timeline.filter(t=>t.done).length;
  let html=topProgress("🗓️ לוח זמנים","ציר זמן של המעבר — לחיצה על משימה מסמנת שבוצעה",
    S.timeline.length?Math.round(dn/S.timeline.length*100):0);
  let any=false; html+=`<div class="tl">`;
  weeks.forEach(week=>{
    const items=S.timeline.filter(t=>t.week===week), vis=items.filter(tlVisible);
    if(vis.length===0)return; any=true;
    const d=items.filter(t=>t.done).length, pct=Math.round(d/items.length*100);
    const node=d===items.length?"full":(d>0?"part":"");
    html+=`<div class="tl-week"><div class="tl-node ${node}"></div>
      <div class="tl-card"><h4>${esc(week)} <span class="m">${d}/${items.length}</span></h4>
        ${vis.map(t=>`<div class="tl-task ${t.done?"done":""}" data-tl="${t.id}">
          <div class="tl-check">${t.done?"✓":""}</div>
          <div class="tl-ttl">${esc(t.title)}</div>
          <span class="tl-badge">${tlBadge(t.title)}</span>
        </div>`).join("")}
      </div></div>`;
  });
  html+=`</div>`; if(!any)html+=emptyState();
  $("tab-timeline").innerHTML=html;
}

/* =================== EVENTS =================== */
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return;
  S.tab=b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));
  ["dashboard","tasks","install","shop","grocery","budget","timeline"].forEach(n=>$("tab-"+n).classList.toggle("hidden",n!==S.tab));
  renderActive();
});
$("searchInput").addEventListener("input",e=>{S.search=e.target.value.trim().toLowerCase();renderActive();});
$("statusFilter").addEventListener("change",e=>{S.fStatus=e.target.value;renderActive();});
$("priorityFilter").addEventListener("change",e=>{S.fPrio=e.target.value;renderActive();});
$("app").addEventListener("click",e=>{const tog=e.target.closest("[data-toggle]");if(tog)tog.closest("[data-acc]").classList.toggle("open");});

/* tasks */
$("tab-tasks").addEventListener("click",async e=>{
  const seg=e.target.closest("[data-seg] button");
  if(seg){const row=e.target.closest("[data-task]");await updateTask(row.dataset.task,{status:seg.dataset.status});return;}
  const add=e.target.closest("[data-addtask]");
  if(add){const [apt,cat]=JSON.parse(add.dataset.addtask);await addTask(apt,cat);}
});
$("tab-tasks").addEventListener("change",async e=>{const row=e.target.closest("[data-task]");if(row&&e.target.matches("[data-prio]"))await updateTask(row.dataset.task,{priority:e.target.value});});
$("tab-tasks").addEventListener("blur",async e=>{
  if(e.target.matches("[data-note]")){const row=e.target.closest("[data-task]");const t=S.tasks.find(x=>x.id===row.dataset.task);
    if(t&&(t.notes||"")!==e.target.value)await updateTask(row.dataset.task,{notes:e.target.value});}
},true);
async function updateTask(id,patch){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;Object.assign(t,patch);saveCache();if(S.tab==="tasks")renderTasks();
  const {error}=await sb.from("tasks").update(patch).eq("id",id);if(error){toast("שמירה נכשלה — אין הרשאה?");loadData();}
}
async function addTask(apt,cat){
  const title=prompt("שם המשימה החדשה:");if(!title)return;
  const sort=Math.max(0,...S.tasks.map(t=>t.sort_order||0))+1;
  const row={project_id:S.projectId,apartment:apt,category:cat,title,status:"pending",priority:"normal",notes:"",sort_order:sort};
  const {data,error}=await sb.from("tasks").insert(row).select().single();
  if(error){toast("הוספה נכשלה");return;}S.tasks.push(data);saveCache();renderTasks();
}

/* installations (sync to budget) */
$("tab-install").addEventListener("change",async e=>{
  const tr=e.target.closest("[data-inst]");if(!tr)return;const id=tr.dataset.inst;
  if(e.target.matches("[data-istatus]"))await updateInstall(id,{status:e.target.value},true);
});
$("tab-install").addEventListener("blur",async e=>{
  const tr=e.target.closest("[data-inst]");if(!tr)return;const id=tr.dataset.inst;const it=S.install.find(x=>x.id===id);
  if(e.target.matches("[data-idate]")&&(it.date||"")!==e.target.value)await updateInstall(id,{date:e.target.value});
  if(e.target.matches("[data-inote]")&&(it.notes||"")!==e.target.value)await updateInstall(id,{notes:e.target.value});
},true);
$("tab-install").addEventListener("click",async e=>{
  const del=e.target.closest("[data-delinst]");
  if(del){const tr=e.target.closest("[data-inst]");const id=tr.dataset.inst;const it=S.install.find(x=>x.id===id);
    if(confirm(`למחוק את "${it.item}"?`)){S.install=S.install.filter(x=>x.id!==id);saveCache();renderInstall();
      const {error}=await sb.from("installations").delete().eq("id",id);if(error){toast("מחיקה נכשלה");loadData();}}return;}
  if(e.target.id==="addInstall")await addInstall();
});
async function updateInstall(id,patch,syncBudget){
  const it=S.install.find(x=>x.id===id);if(!it)return;Object.assign(it,patch);saveCache();
  if(S.tab==="install")renderInstall();
  if(syncBudget)toast("💰 עודכן גם בלשונית התקציב");
  const {error}=await sb.from("installations").update(patch).eq("id",id);if(error){toast("שמירה נכשלה — אין הרשאה?");loadData();}
}
async function addInstall(){
  const item=prompt("שם ההובלה/התקנה:");if(!item)return;
  const sort=Math.max(0,...S.install.map(i=>i.sort_order||0))+1;
  const row={project_id:S.projectId,item,supplier:"",phone:"",date:"",time:"",status:"pending",delivery:0,payment:"",notes:"",sort_order:sort};
  const {data,error}=await sb.from("installations").insert(row).select().single();
  if(error){toast("הוספה נכשלה");return;}S.install.push(data);saveCache();renderInstall();
}

/* shop */
$("tab-shop").addEventListener("change",async e=>{const tr=e.target.closest("[data-shop]");if(tr&&e.target.matches("[data-sstatus]"))await updateShop(tr.dataset.shop,{status:e.target.value});});
$("tab-shop").addEventListener("blur",async e=>{
  const tr=e.target.closest("[data-shop]");if(!tr)return;const it=S.shop.find(x=>x.id===tr.dataset.shop);
  if(e.target.matches("[data-snote]")&&(it.notes||"")!==e.target.value)await updateShop(tr.dataset.shop,{notes:e.target.value});
},true);
$("tab-shop").addEventListener("click",async e=>{
  const del=e.target.closest("[data-delshop]");
  if(del){const tr=e.target.closest("[data-shop]");const id=tr.dataset.shop;const it=S.shop.find(x=>x.id===id);
    if(confirm(`למחוק את "${it.item}"?`)){S.shop=S.shop.filter(x=>x.id!==id);saveCache();renderShop();
      const {error}=await sb.from("shop_items").delete().eq("id",id);if(error){toast("מחיקה נכשלה");loadData();}}return;}
  const add=e.target.closest("[data-addshop]");if(add)await addShop(add.dataset.addshop);
});
async function updateShop(id,patch){
  const it=S.shop.find(x=>x.id===id);if(!it)return;Object.assign(it,patch);saveCache();if(S.tab==="shop")renderShop();
  const {error}=await sb.from("shop_items").update(patch).eq("id",id);if(error){toast("שמירה נכשלה — אין הרשאה?");loadData();}
}
async function addShop(cat){
  const item=prompt("שם הפריט החדש:");if(!item)return;
  const sort=Math.max(0,...S.shop.map(s=>s.sort_order||0))+1;
  const row={project_id:S.projectId,category:cat,item,supplier:"",link:"",order_number:"",price:0,status:"pending",budget_cat:"📦 שונות",notes:"",sort_order:sort};
  const {data,error}=await sb.from("shop_items").insert(row).select().single();
  if(error){toast("הוספה נכשלה");return;}S.shop.push(data);saveCache();renderShop();
}

/* grocery */
$("tab-grocery").addEventListener("click",async e=>{
  const row=e.target.closest("[data-gro]");if(!row)return;const g=S.grocery.find(x=>x.id===row.dataset.gro);if(!g)return;
  g.checked=!g.checked;saveCache();renderGrocery();
  const {error}=await sb.from("grocery_items").update({checked:g.checked}).eq("id",g.id);if(error){toast("שמירה נכשלה");loadData();}
});

/* budget */
$("tab-budget").addEventListener("click",e=>{
  const c=e.target.closest("[data-bud]");if(!c)return;
  const cat=c.dataset.bud;S.budOpen=(S.budOpen===cat)?null:cat;renderBudget();
});

/* timeline */
$("tab-timeline").addEventListener("click",async e=>{
  const row=e.target.closest("[data-tl]");if(!row)return;const t=S.timeline.find(x=>x.id===row.dataset.tl);if(!t)return;
  t.done=!t.done;saveCache();renderTimeline();
  const {error}=await sb.from("timeline_items").update({done:t.done}).eq("id",t.id);if(error){toast("שמירה נכשלה");loadData();}
});

/* =================== MEMBERS =================== */
$("membersBtn").onclick=()=>{renderMembers();$("memberModal").classList.add("show");};
$("tab-dashboard").addEventListener("click",e=>{if(e.target.closest("#dashInvite")){renderMembers();$("memberModal").classList.add("show");}});
$("closeMembers").onclick=()=>$("memberModal").classList.remove("show");
$("memberModal").addEventListener("click",e=>{if(e.target===$("memberModal"))$("memberModal").classList.remove("show");});
function renderMembers(){
  const roleMap={manager:["מנהל","role-manager"],full:["מלא","role-full"],limited:["מוגבל","role-limited"]};
  let html=S.members.map(m=>{
    const r=roleMap[m.role]||["—","role-limited"];const initial=(m.email||"?").charAt(0).toUpperCase();
    const pending=m.user_id?"":`<span class="pending-tag">· ממתין להרשמה</span>`;
    const canRemove=isManager()&&m.role!=="manager";
    const roleControl=isManager()&&m.role!=="manager"
      ? `<select class="st-select" data-memrole="${m.id}"><option value="full" ${m.role==="full"?"selected":""}>הרשאה מלאה</option><option value="limited" ${m.role==="limited"?"selected":""}>הרשאה מוגבלת</option></select>`
      : `<span class="role-tag ${r[1]}">${r[0]}</span>`;
    return `<div class="mem"><div class="av">${esc(initial)}</div>
      <div class="info"><b>${esc(m.email)}</b> ${pending}<br><small>${m.role==="manager"?"מנהל הפרויקט":""}</small></div>
      ${roleControl}${canRemove?`<button class="del-row" data-memdel="${m.id}">🗑</button>`:""}</div>`;
  }).join("");
  if(isManager()){
    html+=`<div class="add-mem"><input type="email" id="newMemEmail" placeholder="אימייל של חבר חדש" />
      <select id="newMemRole"><option value="limited">הרשאה מוגבלת</option><option value="full">הרשאה מלאה</option></select>
      <button class="btn sm" id="addMemBtn">➕ הוספה</button></div>
      <p style="color:var(--muted);font-size:12.5px;margin-top:10px">המוזמן יקבל גישה לאחר שיירשם עם אותו אימייל. <b>הרשאה מוגבלת</b> = עדכון סטטוסים בלבד · <b>הרשאה מלאה</b> = הוספה ועריכה.</p>`;
  }else{ html+=`<p style="color:var(--muted);font-size:13px;margin-top:12px">רק מנהל הפרויקט יכול להוסיף או להסיר חברים.</p>`; }
  $("memberBody").innerHTML=html;
  if(isManager()){
    $("addMemBtn").onclick=addMember;
    $("memberBody").querySelectorAll("[data-memrole]").forEach(sel=>sel.onchange=async()=>{
      const {error}=await sb.from("project_members").update({role:sel.value}).eq("id",sel.dataset.memrole);
      if(error)toast("עדכון נכשל");else{toast("עודכן");await loadData();renderMembers();}});
    $("memberBody").querySelectorAll("[data-memdel]").forEach(btn=>btn.onclick=async()=>{
      if(!confirm("להסיר חבר זה מהפרויקט?"))return;
      const {error}=await sb.from("project_members").delete().eq("id",btn.dataset.memdel);
      if(error)toast("הסרה נכשלה");else{toast("הוסר");await loadData();renderMembers();}});
  }
}
async function addMember(){
  const email=$("newMemEmail").value.trim().toLowerCase(),role=$("newMemRole").value;
  if(!email){toast("יש להזין אימייל");return;}
  const {error}=await sb.from("project_members").insert({project_id:S.projectId,email,role,user_id:null});
  if(error){toast(/duplicate/i.test(error.message)?"החבר כבר קיים":"הוספה נכשלה");return;}
  $("newMemEmail").value="";toast("נוסף בהצלחה");await loadData();renderMembers();
}

setAuthMode("login"); wireAuthSwitch();
sb.auth.onAuthStateChange((event)=>{ if(event==="SIGNED_OUT")showAuth(); });
init();
</script>
